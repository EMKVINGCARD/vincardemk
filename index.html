<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincard Stok Takip — Tek Dosya</title>
    <!-- Modern Görünüm İçin CSS (GitHub Pages Dostu) -->
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #3498db;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        h2 {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #95a5a6;
            background: #fdfefe;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #bdc3c7;
        }
        .dashboard {
            display: none;
        }
        .logout-btn {
            background-color: #e74c3c;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="loginPage" class="container">
        <div class="icon">📦</div>
        <h1>Vincard</h1>
        <h2>Stok Takip Sistemi (Tek Dosya)</h2>
        
        <div class="form-group">
            <label for="username">Kullanıcı Adı</label>
            <input type="text" id="username" placeholder="admin">
        </div>
        
        <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" placeholder="••••••">
        </div>
        
        <button onclick="checkLogin()">Giriş Yap</button>
        
        <div class="hint">
            <strong>Varsayılan:</strong> admin / admin123<br>
            Veriler tarayıcınızın <em>localStorage</em> alanında saklanır.
        </div>
    </div>

    <!-- STOK PANELİ EKRANI (BAŞARILI GİRİŞTEN SONRA AÇILIR) -->
    <div id="dashboardPage" class="container dashboard">
        <div class="icon">📦</div>
        <h1>Vincard</h1>
        <h2>Stok Takip Paneli</h2>
        
        <div style="background: #e8f8f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; color: #27ae60;">
            <strong>Başarıyla Giriş Yapıldı!</strong>
        </div>
        
        <!-- İleride buraya ekleyeceğiniz stok tablosu veya yönetim butonları gelecek -->
        <p>Stok yönetim sisteminiz çalışmaya hazır.</p>
        
        <button class="logout-btn" onclick="logout()">🚪 Çıkış Yap</button>
    </div>

    <!-- JavaScript Kodları (Hafıza Yönetimi) -->
    <script>
        // Sayfa yüklendiğinde daha önce giriş yapılmış mı kontrol et
        window.onload = function() {
            if(localStorage.getItem("vincard_logged") === "true") {
                showDashboard();
            }
        }

        function checkLogin() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;

            if(user === "admin" && pass === "admin123") {
                localStorage.setItem("vincard_logged", "true");
                showDashboard();
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
            }
        }

        function showDashboard() {
            document.getElementById("loginPage").style.display = "none";
            document.getElementById("dashboardPage").style.display = "block";
        }

        function logout() {
            localStorage.removeItem("vincard_logged");
            document.getElementById("loginPage").style.display = "block";
            document.getElementById("dashboardPage").style.display = "none";
        }
    </script>
</body>
</html>
